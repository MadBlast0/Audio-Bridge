name: Bug report
about: Report a reproducible problem with AudioBridge
labels: bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open AudioBridge...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Audio devices and app
      description: Include relevant input/output devices and the application being captured.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal information before sharing.
