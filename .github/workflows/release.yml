name: Build AudioBridge release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select release version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained EXE and build MSI
        shell: pwsh
        run: .\build\Build-Release.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioBridge-Windows-${{ steps.version.outputs.version }}
          path: |
            artifacts/AudioBridge-Setup.msi
            artifacts/AudioBridge.exe
            artifacts/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach release artifacts for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AudioBridge-Setup.msi
            artifacts/AudioBridge.exe
            artifacts/SHA256.txt
          generate_release_notes: true
